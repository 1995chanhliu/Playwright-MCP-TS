name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  #push:
  #  branches:
  #    - main
  #pull_request:
  #  branches:
  #    - main

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        id: playwright-tests
        run: npx playwright test
        continue-on-error: true # Để workflow chạy tiếp bước Healer nếu test fail

      - name: Run Playwright Healer Agent
        if: steps.playwright-tests.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx @playwright/mcp npx playwright test --agent=healer --headless

      - name: Upload Playwright report
        if: always() # Luôn chạy để upload report dù pass hay fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/